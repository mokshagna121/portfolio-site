<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin | Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#087cff; --bg:#050505; --card:#101010; --muted:#a3a3a3; --border:rgba(255,255,255,.12); }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at top right,#092a59 0,transparent 35%),var(--bg); color:#fff; font-family:Inter,Arial,sans-serif; }
    .wrap { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:48px 0 72px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:30px; } h1 { font-size:clamp(28px,5vw,44px); margin:0 0 8px; } p { color:var(--muted); line-height:1.6; } .back { color:#70b5ff; text-decoration:none; font-size:14px; white-space:nowrap; }
    .notice { border-left:3px solid var(--blue); background:#0b1a2e; color:#c9e1ff; padding:14px 16px; border-radius:8px; font-size:13px; margin:0 0 24px; }
    .layout { display:grid; grid-template-columns:370px 1fr; gap:20px; align-items:start; } .panel { background:rgba(16,16,16,.9); border:1px solid var(--border); border-radius:16px; padding:22px; }
    h2 { margin:0 0 18px; font-size:18px; } label { display:block; font-size:12px; font-weight:700; color:#d8d8d8; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
    input, textarea { width:100%; border:1px solid var(--border); border-radius:8px; background:#070707; color:#fff; padding:11px 12px; font:inherit; font-size:14px; } textarea { min-height:100px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; } button,.button { border:0; border-radius:8px; padding:11px 14px; background:var(--blue); color:#fff; font:700 13px Inter,sans-serif; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; } button:hover,.button:hover { filter:brightness(1.12); } .secondary { background:#202020; border:1px solid var(--border); } .danger { background:#582126; } .form-actions,.tools { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
    .project-list { display:grid; gap:12px; } .item { border:1px solid var(--border); background:#0a0a0a; padding:14px; border-radius:11px; display:flex; justify-content:space-between; align-items:center; gap:15px; } .item h3 { margin:0 0 5px; font-size:15px; } .item p { font-size:12px; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px; } .item-actions { display:flex; gap:8px; } .item-actions button { padding:8px 10px; font-size:11px; }
    .status { min-height:20px; color:#7dce9d; font-size:13px; margin:14px 0 0; } .muted { color:var(--muted); font-size:13px; }
    @media(max-width:800px) { .layout { grid-template-columns:1fr; } header { flex-direction:column; } .row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><h1>Projects admin</h1><p>Add, edit, reorder, or remove projects from your portfolio.</p></div><a class="back" href="index.html">← View portfolio</a></header>
    <p class="notice">This starter admin saves to this browser only. It is perfect for editing locally; publishing changes for every visitor needs a database/CMS connection.</p>
    <div class="layout">
      <section class="panel">
        <h2 id="formHeading">Add project</h2>
        <form id="projectForm">
          <label for="title">Project title</label><input id="title" required maxlength="80" placeholder="e.g. VisionID">
          <label for="description">Description</label><textarea id="description" required maxlength="280" placeholder="A short explanation of the project"></textarea>
          <label for="image">Image URL</label><input id="image" type="text" placeholder="https://... or image path">
          <div class="row"><div><label for="icon">Font Awesome icon</label><input id="icon" value="fa-solid fa-code" placeholder="fa-solid fa-code"></div><div><label for="tags">Tags</label><input id="tags" placeholder="AI, Python, IoT"></div></div>
          <div class="row"><div><label for="demoUrl">Live demo URL</label><input id="demoUrl" type="text" placeholder="https://... or #"></div><div><label for="githubUrl">GitHub URL</label><input id="githubUrl" type="text" placeholder="https://github.com/... or #"></div></div>
          <div class="form-actions"><button type="submit" id="saveButton">Save project</button><button type="button" class="secondary" id="cancelButton" hidden>Cancel edit</button></div>
        </form>
        <p class="status" id="status" role="status"></p>
      </section>
      <section class="panel"><h2>Your projects</h2><div id="projectList" class="project-list"></div><div class="tools"><button class="secondary" id="exportButton">Download backup</button><label class="button secondary" for="importFile">Import backup</label><input id="importFile" type="file" accept="application/json" hidden><button class="danger" id="resetButton">Reset projects</button></div></section>
    </div>

  </main>
  <script>
    const storageKey = "pbmr-portfolio-projects";
    const form = document.getElementById("projectForm"), list = document.getElementById("projectList"), status = document.getElementById("status");
    let editingIndex = null;
    const getProjects = () => { try { const items = JSON.parse(localStorage.getItem(storageKey)); return Array.isArray(items) ? items : []; } catch { return []; } };
    const saveProjects = projects => localStorage.setItem(storageKey, JSON.stringify(projects));
    const showStatus = message => { status.textContent = message; setTimeout(() => status.textContent = "", 3000); };
    const render = () => { const projects = getProjects(); list.innerHTML = projects.length ? projects.map((p, i) => `<article class="item"><div><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.description)}</p></div><div class="item-actions"><button class="secondary" data-move="${i}" data-direction="-1" ${i===0?"disabled":""}>↑</button><button class="secondary" data-move="${i}" data-direction="1" ${i===projects.length-1?"disabled":""}>↓</button><button class="secondary" data-edit="${i}">Edit</button><button class="danger" data-delete="${i}">Delete</button></div></article>`).join("") : '<p class="muted">No saved projects yet. Visit <a href="index.html">the portfolio</a> once to import its original three project cards, then come back here.</p>'; };
    const escapeHtml = value => String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const resetForm = () => { editingIndex = null; form.reset(); document.getElementById("icon").value = "fa-solid fa-code"; document.getElementById("formHeading").textContent = "Add project"; document.getElementById("saveButton").textContent = "Save project"; document.getElementById("cancelButton").hidden = true; };
    form.addEventListener("submit", event => { event.preventDefault(); const project = { title:title.value.trim(), description:description.value.trim(), image:image.value.trim(), icon:icon.value.trim() || "fa-solid fa-code", tags:tags.value.split(",").map(tag=>tag.trim()).filter(Boolean), demoUrl:demoUrl.value.trim(), githubUrl:githubUrl.value.trim() }; const projects = getProjects(); editingIndex === null ? projects.push(project) : projects[editingIndex] = project; saveProjects(projects); render(); showStatus(editingIndex === null ? "Project added." : "Project updated."); resetForm(); });
    list.addEventListener("click", event => { const button = event.target.closest("button"); if (!button) return; const index = Number(button.dataset.edit ?? button.dataset.delete ?? button.dataset.move); const projects = getProjects(); if (button.dataset.delete !== undefined) { if (confirm(`Delete “${projects[index].title}”?`)) { projects.splice(index,1); saveProjects(projects); render(); showStatus("Project deleted."); } } else if (button.dataset.edit !== undefined) { const p=projects[index]; editingIndex=index; title.value=p.title; description.value=p.description; image.value=p.image || ""; icon.value=p.icon || "fa-solid fa-code"; tags.value=(p.tags || []).join(", "); demoUrl.value=p.demoUrl || ""; githubUrl.value=p.githubUrl || ""; document.getElementById("formHeading").textContent="Edit project"; document.getElementById("saveButton").textContent="Update project"; document.getElementById("cancelButton").hidden=false; window.scrollTo({top:0,behavior:"smooth"}); } else if (button.dataset.move !== undefined) { const target=index+Number(button.dataset.direction); [projects[index],projects[target]]=[projects[target],projects[index]]; saveProjects(projects); render(); } });
    document.getElementById("cancelButton").addEventListener("click", resetForm);
    document.getElementById("exportButton").addEventListener("click", () => { const file=new Blob([JSON.stringify(getProjects(),null,2)],{type:"application/json"}); const link=document.createElement("a"); link.href=URL.createObjectURL(file); link.download="portfolio-projects-backup.json"; link.click(); URL.revokeObjectURL(link.href); });
    document.getElementById("importFile").addEventListener("change", event => { const file=event.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{ try { const projects=JSON.parse(reader.result); if(!Array.isArray(projects))throw new Error(); saveProjects(projects); render(); showStatus("Backup imported."); } catch { alert("That file is not a valid projects backup."); } }; reader.readAsText(file); event.target.value=""; });
    document.getElementById("resetButton").addEventListener("click", () => { if(confirm("Remove all saved projects from this browser?")){localStorage.removeItem(storageKey); render(); resetForm(); showStatus("Projects reset.");} });
    render();


  </script>
</body>
</html>
